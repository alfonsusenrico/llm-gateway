[project]
name = "llm-gateway-client"
version = "0.3.0"
description = "Typed Python client for LLM Gateway: safe retries, typed errors, grant-sized concurrency."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alfonsus Enrico", email = "enrico.soebijanto@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.1,<3",
    "pydantic>=2.13,<3",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
