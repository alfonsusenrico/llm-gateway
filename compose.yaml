name: llm-gateway

x-gateway-environment: &gateway-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Containers reach the database by service name; the host-side DATABASE_URL in
  # .env is for running tools outside Docker.
  DATABASE_URL: postgresql://${POSTGRES_USER:-llm_gateway}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-llm_gateway}
  PROJECT_KEY_PEPPER: ${PROJECT_KEY_PEPPER:?Set PROJECT_KEY_PEPPER in .env}
  AUTH_FAILURE_LIMIT_PER_MINUTE: ${AUTH_FAILURE_LIMIT_PER_MINUTE:-10}
  TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
  LLM_CALL_TIMEOUT_SECONDS: ${LLM_CALL_TIMEOUT_SECONDS:-180}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
  PROVIDER_CREDENTIAL_ENCRYPTION_KEY: ${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-}
  RESULT_ENCRYPTION_KEY: ${RESULT_ENCRYPTION_KEY:?Set RESULT_ENCRYPTION_KEY in .env}
  RESULT_RETENTION_SECONDS: ${RESULT_RETENTION_SECONDS:-86400}
  REQUEST_MAX_BYTES: ${REQUEST_MAX_BYTES:-20000000}
  DEFAULT_MAX_OUTPUT_TOKENS: ${DEFAULT_MAX_OUTPUT_TOKENS:-4096}
  ALLOCATION_CAPACITY_REQUESTS_PER_MINUTE: ${ALLOCATION_CAPACITY_REQUESTS_PER_MINUTE:-120}
  ALLOCATION_CAPACITY_CONCURRENCY: ${ALLOCATION_CAPACITY_CONCURRENCY:-8}
  GLOBAL_MONTHLY_BUDGET_USD: ${GLOBAL_MONTHLY_BUDGET_USD:-5.00}
  ALLOCATION_MIN_REQUESTS_PER_MINUTE: ${ALLOCATION_MIN_REQUESTS_PER_MINUTE:-5}
  ALLOCATION_MIN_CONCURRENCY: ${ALLOCATION_MIN_CONCURRENCY:-1}
  ALLOCATION_MIN_MONTHLY_BUDGET_USD: ${ALLOCATION_MIN_MONTHLY_BUDGET_USD:-0.10}
  NOTIFIER_TELEGRAM_BOT_TOKEN: ${NOTIFIER_TELEGRAM_BOT_TOKEN:-}
  NOTIFIER_TELEGRAM_CHAT_ID: ${NOTIFIER_TELEGRAM_CHAT_ID:-}
  NOTIFIER_DEDUPE_WINDOW_SECONDS: ${NOTIFIER_DEDUPE_WINDOW_SECONDS:-900}
  NOTIFIER_MAX_EVENT_AGE_SECONDS: ${NOTIFIER_MAX_EVENT_AGE_SECONDS:-86400}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-llm_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Loopback only: host-side tests and tools use it; nothing else should.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-54330}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      args:
        APP_REVISION: ${APP_REVISION:-local}
    image: llm-gateway:${APP_REVISION:-local}
    command: ["sh", "-c", "llm-gateway-migrate && llm-gateway-admin models sync"]
    environment: *gateway-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    # The image's health check probes the API port, which only the api service serves.
    healthcheck:
      disable: true

  api:
    image: llm-gateway:${APP_REVISION:-local}
    restart: unless-stopped
    environment: *gateway-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8360}:8000"

  worker:
    image: llm-gateway:${APP_REVISION:-local}
    command: ["llm-gateway-worker"]
    restart: unless-stopped
    environment: *gateway-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
    healthcheck:
      disable: true

volumes:
  db-data:
