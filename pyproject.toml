[project]
name = "llm-gateway"
version = "0.7.0"
description = "Personal LLM gateway: provider calls, failure policy, and cost control for registered projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alfonsus Enrico", email = "enrico.soebijanto@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=46",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "openai>=3.29,<4",
    "pillow>=12.3,<13",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
llm-gateway-admin = "llm_gateway.admin.cli:main"
llm-gateway-migrate = "llm_gateway.db.migrate:main"
llm-gateway-worker = "llm_gateway.worker:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "llm-gateway-client",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv.workspace]
members = ["clients/python"]

[tool.uv.sources]
llm-gateway-client = { workspace = true }

[tool.ruff]
line-length = 100
extend-include = ["scripts/setup-local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fixture credentials for disposable services, and seeded
# pseudo-random inputs for reproducible property tests.
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]
"clients/python/tests/**/*.py" = ["S101", "S105", "S106", "S311"]

[tool.pyright]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "clients/python/src", "clients/python/tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "clients/python/tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "db: needs the disposable Postgres database; fails instead of skipping when REQUIRE_DB=1",
]
